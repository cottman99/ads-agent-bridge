<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">ADS 2027 headless AC execution benchmark</title>
  <desc id="desc">Four rows compare Agent end-to-end wall time and strict execution pass counts for Codex or Pi Agent using EDA Runtime MCP or the official ADS MCP.</desc>
  <style>
    .title{font:700 25px Inter,Segoe UI,sans-serif;fill:#152233}
    .subtitle{font:14px Inter,Segoe UI,sans-serif;fill:#526071}
    .label{font:600 14px Inter,Segoe UI,sans-serif;fill:#263548}
    .value{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#152233}
    .axis{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#697789}
    .note{font:12px Inter,Segoe UI,sans-serif;fill:#697789}
    .grid{stroke:#dfe5ec;stroke-width:1}
  </style>
  <rect width="1120" height="100%" fill="#ffffff"/>
  <text x="40" y="42" class="title" text-anchor="start">ADS 2027 headless AC execution</text>
  <text x="40" y="68" class="subtitle" text-anchor="start">Agent end-to-end median; whiskers show the three-run range. Labels include strict pass count.</text>
  <line x1="280.0" y1="108" x2="280.0" y2="350" class="grid"/>
  <text x="280" y="374" class="axis" text-anchor="middle">0s</text>
  <line x1="428.0" y1="108" x2="428.0" y2="350" class="grid"/>
  <text x="428" y="374" class="axis" text-anchor="middle">40s</text>
  <line x1="576.0" y1="108" x2="576.0" y2="350" class="grid"/>
  <text x="576" y="374" class="axis" text-anchor="middle">80s</text>
  <line x1="724.0" y1="108" x2="724.0" y2="350" class="grid"/>
  <text x="724" y="374" class="axis" text-anchor="middle">120s</text>
  <line x1="872.0" y1="108" x2="872.0" y2="350" class="grid"/>
  <text x="872" y="374" class="axis" text-anchor="middle">160s</text>
  <line x1="1020.0" y1="108" x2="1020.0" y2="350" class="grid"/>
  <text x="1020" y="374" class="axis" text-anchor="middle">200s</text>
  <text x="40" y="140" class="label" text-anchor="start">Codex · EDA Runtime</text>
  <rect x="280" y="120" width="576.8" height="28" rx="4" fill="#2f6fed"/>
  <line x1="757.8" y1="134" x2="972.2" y2="134" stroke="#152233" stroke-width="2"/>
  <line x1="757.8" y1="128" x2="757.8" y2="140" stroke="#152233" stroke-width="2"/>
  <line x1="972.2" y1="128" x2="972.2" y2="140" stroke="#152233" stroke-width="2"/>
  <text x="982.196" y="140" class="value" text-anchor="start">155.9s · 1/3</text>
  <text x="40" y="202" class="label" text-anchor="start">Codex · Official MCP</text>
  <rect x="280" y="182" width="230.5" height="28" rx="4" fill="#e3a12f"/>
  <line x1="488.5" y1="196" x2="514.2" y2="196" stroke="#152233" stroke-width="2"/>
  <line x1="488.5" y1="190" x2="488.5" y2="202" stroke="#152233" stroke-width="2"/>
  <line x1="514.2" y1="190" x2="514.2" y2="202" stroke="#152233" stroke-width="2"/>
  <text x="524.158" y="202" class="value" text-anchor="start">62.3s · 3/3</text>
  <text x="40" y="264" class="label" text-anchor="start">Pi Agent · EDA Runtime</text>
  <rect x="280" y="244" width="341.4" height="28" rx="4" fill="#2f6fed"/>
  <line x1="556.9" y1="258" x2="984.3" y2="258" stroke="#152233" stroke-width="2"/>
  <line x1="556.9" y1="252" x2="556.9" y2="264" stroke="#152233" stroke-width="2"/>
  <line x1="984.3" y1="252" x2="984.3" y2="264" stroke="#152233" stroke-width="2"/>
  <text x="994.295" y="264" class="value" text-anchor="start">92.3s · 3/3</text>
  <text x="40" y="326" class="label" text-anchor="start">Pi Agent · Official MCP</text>
  <rect x="280" y="306" width="187.0" height="28" rx="4" fill="#e3a12f"/>
  <line x1="460.2" y1="320" x2="498.5" y2="320" stroke="#152233" stroke-width="2"/>
  <line x1="460.2" y1="314" x2="460.2" y2="326" stroke="#152233" stroke-width="2"/>
  <line x1="498.5" y1="314" x2="498.5" y2="326" stroke="#152233" stroke-width="2"/>
  <text x="508.489" y="326" class="value" text-anchor="start">50.6s · 3/3</text>
  <text x="40" y="418" class="note" text-anchor="start">ADS 2027 · Runtime MCP + current Skills vs official MCP · 3 fresh repetitions per row · 2026-09-01</text>
</svg>
