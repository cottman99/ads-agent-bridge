<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">ADS 2027 headless AC execution benchmark</title>
  <desc id="desc">Five rows compare median wall time and range for Codex or Pi Agent using Bridge a29, Bridge a48, or the official ADS MCP. All headless execution runs passed.</desc>
  <style>
    .title{font:700 25px Inter,Segoe UI,sans-serif;fill:#152233}
    .subtitle{font:14px Inter,Segoe UI,sans-serif;fill:#526071}
    .label{font:600 14px Inter,Segoe UI,sans-serif;fill:#263548}
    .value{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#152233}
    .axis{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#697789}
    .note{font:12px Inter,Segoe UI,sans-serif;fill:#697789}
    .grid{stroke:#dfe5ec;stroke-width:1}
  </style>
  <rect width="1120" height="100%" fill="#ffffff"/>
  <text x="40" y="42" class="title" text-anchor="start">ADS 2027 headless AC execution</text>
  <text x="40" y="68" class="subtitle" text-anchor="start">Median end-to-end wall time; whiskers show the three-run range. Every E3 run passed.</text>
  <line x1="260.0" y1="108" x2="260.0" y2="430" class="grid"/>
  <text x="260" y="452" class="axis" text-anchor="middle">0s</text>
  <line x1="400.0" y1="108" x2="400.0" y2="430" class="grid"/>
  <text x="400" y="452" class="axis" text-anchor="middle">20s</text>
  <line x1="540.0" y1="108" x2="540.0" y2="430" class="grid"/>
  <text x="540" y="452" class="axis" text-anchor="middle">40s</text>
  <line x1="680.0" y1="108" x2="680.0" y2="430" class="grid"/>
  <text x="680" y="452" class="axis" text-anchor="middle">60s</text>
  <line x1="820.0" y1="108" x2="820.0" y2="430" class="grid"/>
  <text x="820" y="452" class="axis" text-anchor="middle">80s</text>
  <line x1="960.0" y1="108" x2="960.0" y2="430" class="grid"/>
  <text x="960" y="452" class="axis" text-anchor="middle">100s</text>
  <text x="40" y="140" class="label" text-anchor="start">Codex · Bridge a29</text>
  <rect x="260" y="120" width="575.8" height="28" rx="4" fill="#94a3b8"/>
  <line x1="725.9" y1="134" x2="970.6" y2="134" stroke="#152233" stroke-width="2"/>
  <line x1="725.9" y1="128" x2="725.9" y2="140" stroke="#152233" stroke-width="2"/>
  <line x1="970.6" y1="128" x2="970.6" y2="140" stroke="#152233" stroke-width="2"/>
  <text x="980.591" y="140" class="value" text-anchor="start">82.3s · 3/3</text>
  <text x="40" y="202" class="label" text-anchor="start">Codex · Bridge a48</text>
  <rect x="260" y="182" width="453.6" height="28" rx="4" fill="#2f6fed"/>
  <line x1="698.6" y1="196" x2="810.6" y2="196" stroke="#152233" stroke-width="2"/>
  <line x1="698.6" y1="190" x2="698.6" y2="202" stroke="#152233" stroke-width="2"/>
  <line x1="810.6" y1="190" x2="810.6" y2="202" stroke="#152233" stroke-width="2"/>
  <text x="820.648" y="202" class="value" text-anchor="start">64.8s · 3/3</text>
  <text x="40" y="264" class="label" text-anchor="start">Codex · Official MCP</text>
  <rect x="260" y="244" width="371.8" height="28" rx="4" fill="#e3a12f"/>
  <line x1="610.8" y1="258" x2="654.2" y2="258" stroke="#152233" stroke-width="2"/>
  <line x1="610.8" y1="252" x2="610.8" y2="264" stroke="#152233" stroke-width="2"/>
  <line x1="654.2" y1="252" x2="654.2" y2="264" stroke="#152233" stroke-width="2"/>
  <text x="664.219" y="264" class="value" text-anchor="start">53.1s · 3/3</text>
  <text x="40" y="326" class="label" text-anchor="start">Pi Agent · Bridge a48</text>
  <rect x="260" y="306" width="307.6" height="28" rx="4" fill="#2f6fed"/>
  <line x1="546.2" y1="320" x2="629.8" y2="320" stroke="#152233" stroke-width="2"/>
  <line x1="546.2" y1="314" x2="546.2" y2="326" stroke="#152233" stroke-width="2"/>
  <line x1="629.8" y1="314" x2="629.8" y2="326" stroke="#152233" stroke-width="2"/>
  <text x="639.824" y="326" class="value" text-anchor="start">43.9s · 3/3</text>
  <text x="40" y="388" class="label" text-anchor="start">Pi Agent · Official MCP</text>
  <rect x="260" y="368" width="263.7" height="28" rx="4" fill="#e3a12f"/>
  <line x1="513.4" y1="382" x2="527.2" y2="382" stroke="#152233" stroke-width="2"/>
  <line x1="513.4" y1="376" x2="513.4" y2="388" stroke="#152233" stroke-width="2"/>
  <line x1="527.2" y1="376" x2="527.2" y2="388" stroke="#152233" stroke-width="2"/>
  <text x="537.169" y="388" class="value" text-anchor="start">37.7s · 3/3</text>
  <text x="40" y="495" class="note" text-anchor="start">ADS 2027 · gpt-5.6-terra medium · serial counterbalanced · 3 repetitions per row · 2026-09-01</text>
</svg>
